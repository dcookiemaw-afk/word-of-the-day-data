name: Daily Word Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-words:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Newer version to stop warnings

      - name: Install Dependencies
        run: pip install google-generativeai

      - name: Run Word Generator
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Links your secret to the script
        run: python generate_words.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add words.json
          git commit -m "Daily update: $(date +'%Y-%m-%d')" || exit 0
          git push
