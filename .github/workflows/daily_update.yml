name: Daily Word Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-words:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate words.json using Gemini
        env:
          GEMINI_API_KEY_WORD_OF_THE_DAY: ${{ secrets.GEMINI_API_KEY_WORD_OF_THE_DAY }}
        run: python generate_words.py

      - name: Commit and push updated words.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add words.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily words list" && git push)
